[package]
name = "alpaca-cli"
description = "Read-only CLI for Alpaca brokerage accounts (piekstra-cli/1), over the official Trading API."
version = "0.2.0"
edition = "2021"
# pk-cli-mcp (rmcp 3.8, the `stdio` feature) needs 1.88.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/piekstra/alpaca-cli"
homepage = "https://github.com/piekstra/alpaca-cli"
authors = ["piekstra"]
publish = false

[lib]
name = "alp"
path = "src/lib.rs"

[[bin]]
name = "alp"
path = "src/main.rs"

[dependencies]
pk-cli-core = { git = "https://github.com/piekstra/cli-common", tag = "v0.12.0", features = ["reqwest"] }
pk-cli-secrets = { git = "https://github.com/piekstra/cli-common", tag = "v0.12.0" }
pk-cli-config = { git = "https://github.com/piekstra/cli-common", tag = "v0.12.0" }
pk-cli-selfupdate = { git = "https://github.com/piekstra/cli-common", tag = "v0.12.0" }
pk-cli-auth = { git = "https://github.com/piekstra/cli-common", tag = "v0.12.0" }
pk-cli-http = { git = "https://github.com/piekstra/cli-common", tag = "v0.12.0" }
# `alp mcp`: the MCP profile's tools over the same commands (DESIGN.md §1.9).
pk-cli-mcp = { git = "https://github.com/piekstra/cli-common", tag = "v0.12.0", features = ["stdio"] }
schemars = "1"

clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps JSON object key order at insertion order, which is what
# SPEC v1 §1.4 promises for rendered output — and what keeps the verbatim
# activity rows in `transaction-list/v1` byte-comparable to the wire.
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
# The MCP profile's conformance checks, for the tests only.
pk-cli-mcp = { git = "https://github.com/piekstra/cli-common", tag = "v0.12.0", features = ["test-util"] }
assert_cmd = "2"
predicates = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
